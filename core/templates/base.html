{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Eduardo Duarte Salvador, Guilherme Henrique Moreira de Oliveira">

    <title>{% block title %}{% endblock %}</title>

    <link rel="shortcut icon" href="{% static '/img/favicon.ico' %}" type="image/x-icon">

    <link href="{% static 'bootstrap-5.3.8-dist/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="{% static 'bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js' %}"></script>

    {% block extra_css %}{% endblock extra_css %}
</head>

<body>
    <header>
        {% block header %}
        {% endblock header %}
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        {% block footer %}
        {% endblock footer %}
    </footer>

    {% block js %}
    {% endblock js %}
</body>
</html>
