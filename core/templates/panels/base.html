{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>

    <link rel="shortcut icon" href="{% static '/img/favicon.ico' %}" type="image/x-icon">

    <link href="{% static 'bootstrap-5.3.8-dist/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    <script src="{% static 'bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js' %}"></script>

    {% block extra_css %}{% endblock extra_css %}
</head>
<body>
    <header>
        <div class="px-3 py-2 text-bg-dark border-bottom"> 
            <div class="container"> 
                <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start"> 
                    <a href="/" class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none"> 
                        <svg class="bi me-2" width="40" height="32" role="img" aria-label="Bootstrap">
                            <use xlink:href="#bootstrap"></use>
                        </svg> 
                    </a> 
                    <ul class="nav col-12 col-lg-auto my-2 justify-content-center my-md-0 text-small"> 
                        <li> 
                            <a href="#" class="nav-link text-secondary"> 
                                <svg class="bi d-block mx-auto mb-1" width="24" height="24" aria-hidden="true">
                                    <use xlink:href="#home"></use>
                                </svg>
                                Home
                            </a> 
                        </li> 
                        <li> 
                            <a href="#" class="nav-link text-white"> 
                                <svg class="bi d-block mx-auto mb-1" width="24" height="24" aria-hidden="true">
                                    <use xlink:href="#speedometer2"></use>
                                </svg>
                                Dashboard
                            </a> 
                        </li> 
                        <li> 
                            <a href="#" class="nav-link text-white"> 
                                <svg class="bi d-block mx-auto mb-1" width="24" height="24" aria-hidden="true">
                                    <use xlink:href="#table"></use>
                                </svg>
                                Orders
                            </a> 
                        </li> 
                        <li> 
                            <a href="#" class="nav-link text-white"> 
                                <svg class="bi d-block mx-auto mb-1" width="24" height="24" aria-hidden="true">
                                    <use xlink:href="#grid"></use>
                                </svg>
                                Products
                            </a> 
                        </li> 
                        <li> 
                            <a href="#" class="nav-link text-white"> 
                                <svg class="bi d-block mx-auto mb-1" width="24" height="24" aria-hidden="true">
                                    <use xlink:href="#people-circle"></use>
                                </svg>
                                Customers
                            </a> 
                        </li> 
                    </ul> 
                </div> 
            </div> 
        </div>
    </header>
    <main>
        <form>
            {% csrf_token %}
            <a href="logout">Sair</a>
        </form>
        {% block content %}
        {% endblock %}
    </main>
    <footer>

    </footer>
</body>
</html>
